name: Günlük Tarama (09:30 İstanbul)

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -q -r requirements.txt

      - name: xutum_tarama_v2.py çalıştır
        run: python xutum_tarama_v2.py

      - name: xutum_tarama_haftalik_son.py çalıştır
        run: python xutum_tarama_haftalik_son.py

      - name: Sonuçları arşivle
        run: |
          TARIH=$(TZ=Europe/Istanbul date +%F)
          mkdir -p "results/gunluk/$TARIH"
          cp -f xutum_tarama.csv xutum_sinyal.csv "results/gunluk/$TARIH/" 2>/dev/null || true
          cp -f xutum_tarama_haftalik.csv xutum_sinyal_haftalik.csv "results/gunluk/$TARIH/" 2>/dev/null || true
          cp -f xutum_sinyal.csv results/gunluk/latest_xutum_sinyal.csv 2>/dev/null || true
          cp -f xutum_tarama.csv results/gunluk/latest_xutum_tarama.csv 2>/dev/null || true
          cp -f xutum_sinyal_haftalik.csv results/gunluk/latest_xutum_sinyal_haftalik.csv 2>/dev/null || true
          cp -f xutum_tarama_haftalik.csv results/gunluk/latest_xutum_tarama_haftalik.csv 2>/dev/null || true
          echo "$TARIH" > results/gunluk/latest_date.txt

      - name: Commit & push
        run: |
          git config user.name "tarama-bot"
          git config user.email "tarama-bot@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Günlük tarama sonucu: $(TZ=Europe/Istanbul date +%F)"
          git push
